# /etc/nginx/sites-available/lwe-portal  (then: ln -s ../sites-available/lwe-portal /etc/nginx/sites-enabled/)
# Change portal.learningwithearning.org and the PHP version (php8.3-fpm) if yours differ.
server {
    listen 80;
    server_name portal.learningwithearning.org;
    root /var/www/lwe-portal/public;
    index index.php;

    client_max_body_size 25M;            # task files and lesson attachments
    charset utf-8;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # The app's service worker must not be cached for long, or app updates arrive late.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120;        # AI requests can take a while
    }

    location ~ /\.(?!well-known).* { deny all; }
}
