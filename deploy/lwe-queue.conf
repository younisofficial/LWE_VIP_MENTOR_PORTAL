; /etc/supervisor/conf.d/lwe-queue.conf  — keeps the queue worker running (emails, Zoom, AI checks, reminders)
; then: supervisorctl reread && supervisorctl update && supervisorctl start lwe-queue:*
[program:lwe-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/lwe-portal/artisan queue:work --sleep=3 --tries=3 --max-time=3600
directory=/var/www/lwe-portal
user=www-data
numprocs=2
autostart=true
autorestart=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/var/www/lwe-portal/storage/logs/queue.log
